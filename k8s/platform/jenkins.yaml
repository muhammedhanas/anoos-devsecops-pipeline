apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
  storageClassName: local-path
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jenkins
  namespace: platform
spec:
  serviceName: jenkins
  replicas: 1
  selector:
    matchLabels: { app: jenkins }
  template:
    metadata:
      labels: { app: jenkins }
    spec:
      nodeSelector: { workload: ci }
      tolerations:
        - { key: workload, operator: Equal, value: ci, effect: NoSchedule }
      serviceAccountName: jenkins
      containers:
        - name: jenkins
          image: jenkins/jenkins:lts-jdk21
          env:
            - { name: JAVA_OPTS, value: "-Xmx2g -Xms512m" }
          ports:
            - { containerPort: 8080, name: http }
            - { containerPort: 50000, name: agent }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: data, mountPath: /var/jenkins_home }
          readinessProbe:
            httpGet: { path: /login, port: 8080 }
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: jenkins-data }
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: platform
spec:
  selector: { app: jenkins }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: agent, port: 50000, targetPort: 50000 }
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins
  namespace: platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: jenkins-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: jenkins
    namespace: platform
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jenkins
  namespace: platform
spec:
  rules:
    - host: jenkins.anoos.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: jenkins, port: { number: 8080 } } } }
