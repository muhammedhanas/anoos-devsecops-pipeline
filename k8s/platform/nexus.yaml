apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nexus-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 50Gi }
  storageClassName: local-path
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nexus
  namespace: platform
spec:
  serviceName: nexus
  replicas: 1
  selector:
    matchLabels: { app: nexus }
  template:
    metadata:
      labels: { app: nexus }
    spec:
      nodeSelector: { workload: stateful }
      tolerations:
        - key: workload
          operator: Equal
          value: stateful
          effect: NoSchedule
      containers:
        - name: nexus
          image: sonatype/nexus3:3.73.0
          ports:
            - { containerPort: 8081, name: http }
            - { containerPort: 8082, name: docker-hosted }
            - { containerPort: 8083, name: docker-proxy }
          resources:
            requests: { cpu: "500m", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: data, mountPath: /nexus-data }
          readinessProbe:
            httpGet: { path: /service/rest/v1/status, port: 8081 }
            initialDelaySeconds: 60
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: nexus-data }
---
apiVersion: v1
kind: Service
metadata:
  name: nexus
  namespace: platform
spec:
  selector: { app: nexus }
  ports:
    - { name: http, port: 8081, targetPort: 8081 }
    - { name: docker-hosted, port: 8082, targetPort: 8082 }
    - { name: docker-proxy, port: 8083, targetPort: 8083 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nexus
  namespace: platform
spec:
  rules:
    - host: nexus.anoos.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: nexus, port: { number: 8081 } } } }
    - host: nexus-docker.anoos.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: nexus, port: { number: 8082 } } } }
