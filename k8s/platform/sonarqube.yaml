apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarqube-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 20Gi }
  storageClassName: local-path
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: platform
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
  storageClassName: local-path
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: platform
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      nodeSelector: { workload: stateful }
      tolerations:
        - { key: workload, operator: Equal, value: stateful, effect: NoSchedule }
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: sonar }
            - { name: POSTGRES_PASSWORD, value: sonar }
            - { name: POSTGRES_DB, value: sonar }
          ports:
            - { containerPort: 5432 }
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "1Gi" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform
spec:
  selector: { app: postgres }
  ports:
    - { port: 5432, targetPort: 5432 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarqube
  namespace: platform
spec:
  serviceName: sonarqube
  replicas: 1
  selector:
    matchLabels: { app: sonarqube }
  template:
    metadata:
      labels: { app: sonarqube }
    spec:
      nodeSelector: { workload: stateful }
      tolerations:
        - { key: workload, operator: Equal, value: stateful, effect: NoSchedule }
      initContainers:
        - name: init-sysctl
          image: busybox
          command: ["sh", "-c", "sysctl -w vm.max_map_count=262144 && sysctl -w fs.file-max=131072"]
          securityContext: { privileged: true }
      containers:
        - name: sonarqube
          image: sonarqube:lts-community
          env:
            - { name: SONAR_JDBC_URL, value: "jdbc:postgresql://postgres:5432/sonar" }
            - { name: SONAR_JDBC_USERNAME, value: sonar }
            - { name: SONAR_JDBC_PASSWORD, value: sonar }
          ports:
            - { containerPort: 9000 }
          resources:
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "2", memory: "4Gi" }
          volumeMounts:
            - { name: data, mountPath: /opt/sonarqube/data }
          readinessProbe:
            httpGet: { path: /api/system/status, port: 9000 }
            initialDelaySeconds: 90
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: sonarqube-data }
---
apiVersion: v1
kind: Service
metadata:
  name: sonarqube
  namespace: platform
spec:
  selector: { app: sonarqube }
  ports:
    - { port: 9000, targetPort: 9000 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarqube
  namespace: platform
spec:
  rules:
    - host: sonar.anoos.local
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: sonarqube, port: { number: 9000 } } } }
